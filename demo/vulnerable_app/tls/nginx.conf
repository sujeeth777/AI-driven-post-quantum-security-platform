# DELIBERATELY VULNERABLE DEMO APPLICATION — gateway TLS configuration
# Kept on TLS 1.0/1.1 for "compatibility with regional clinics"

server {
    listen 443 ssl;
    server_name records.hospital-a.example;

    ssl_protocols TLSv1 TLSv1.1;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_certificate     /etc/ssl/certs/records-rsa2048.crt;
    ssl_certificate_key /etc/ssl/private/records-rsa2048.key;

    # Session resumption with legacy tickets
    ssl_session_tickets on;
}
